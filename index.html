<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A personal note written for Meow."
    >

    <title>For Meow — A Little Note</title>

    <!-- ================================
         GOOGLE FONTS
    ================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ================================
         MAIN STYLES
    ================================= -->
    <style>

        /* --------------------------------
           ROOT VARIABLES
        -------------------------------- */

        :root {
            --bg-main: #08090d;
            --bg-secondary: #10121a;
            --bg-card: rgba(255, 255, 255, 0.055);

            --text-main: #f5f2ea;
            --text-soft: #b9b7bd;
            --text-muted: #777681;

            --accent: #d7a6ff;
            --accent-soft: #a878d4;

            --border: rgba(255, 255, 255, 0.10);

            --shadow:
                0 25px 80px rgba(0, 0, 0, 0.45);

            --radius-large: 28px;
            --radius-medium: 20px;

            --max-width: 1100px;
        }


        /* --------------------------------
           RESET
        -------------------------------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(166, 102, 255, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(255, 150, 210, 0.08),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(100, 120, 255, 0.07),
                    transparent 35%
                ),
                var(--bg-main);

            color: var(--text-main);

            font-family: "Inter", sans-serif;

            overflow-x: hidden;
        }


        body::selection {
            background: var(--accent);
            color: #111;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button {
            font: inherit;
        }


        /* --------------------------------
           BACKGROUND
        -------------------------------- */

        .background {
            position: fixed;
            inset: 0;

            z-index: -10;

            overflow: hidden;

            pointer-events: none;
        }


        .orb {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.15;

            animation:
                floatOrb 16s ease-in-out infinite alternate;
        }


        .orb.one {
            top: -180px;
            left: -150px;

            background: #9d55ff;
        }


        .orb.two {
            top: 35%;
            right: -180px;

            background: #e27aff;

            animation-delay: -5s;
        }


        .orb.three {
            bottom: -220px;
            left: 35%;

            background: #536cff;

            animation-delay: -9s;
        }


        @keyframes floatOrb {

            from {
                transform: translate3d(0, 0, 0) scale(1);
            }

            to {
                transform: translate3d(30px, -25px, 0) scale(1.12);
            }
        }


        /* --------------------------------
           STAR FIELD
        -------------------------------- */

        .stars {
            position: fixed;

            inset: 0;

            z-index: -5;

            pointer-events: none;
        }


        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.65);

            animation: twinkle 4s infinite ease-in-out;
        }


        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.3);
            }
        }


        /* --------------------------------
           NAVIGATION
        -------------------------------- */

        .nav {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            width: min(
                calc(100% - 32px),
                900px
            );

            padding: 12px 14px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            background:
                rgba(10, 11, 17, 0.72);

            border: 1px solid var(--border);

            border-radius: 999px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.25);

            z-index: 100;
        }


        .nav-logo {
            display: flex;

            align-items: center;

            gap: 9px;

            font-weight: 700;

            font-size: 0.9rem;
        }


        .nav-logo span {
            color: var(--accent);
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 5px;

            list-style: none;
        }


        .nav-links a {
            padding: 9px 13px;

            color: var(--text-soft);

            font-size: 0.78rem;

            border-radius: 999px;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        .nav-links a:hover {
            color: var(--text-main);

            background:
                rgba(255, 255, 255, 0.07);
        }


        /* --------------------------------
           HERO
        -------------------------------- */

        .hero {
            min-height: 100vh;

            max-width: var(--max-width);

            margin: auto;

            padding:
                150px 24px
                90px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .hero-content {
            max-width: 780px;
        }


        .eyebrow {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 22px;

            padding: 8px 15px;

            color: var(--text-soft);

            font-size: 0.75rem;

            letter-spacing: 0.12em;

            text-transform: uppercase;

            background:
                rgba(255, 255, 255, 0.05);

            border:
                1px solid var(--border);

            border-radius: 999px;
        }


        .eyebrow-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--accent);

            box-shadow:
                0 0 14px var(--accent);
        }


        .hero h1 {
            margin-bottom: 20px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(4rem, 11vw, 8.5rem);

            font-weight: 500;

            line-height: 0.82;

            letter-spacing: -0.055em;
        }


        .hero h1 span {
            color: var(--accent);
        }


        .hero-subtitle {
            max-width: 620px;

            margin:
                0 auto 32px;

            color: var(--text-soft);

            font-size:
                clamp(1rem, 2vw, 1.15rem);

            line-height: 1.8;
        }


        .hero-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 145px;

            padding: 13px 20px;

            border-radius: 999px;

            border:
                1px solid var(--border);

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }


        .button:hover {
            transform: translateY(-3px);
        }


        .button.primary {
            color: #151019;

            background:
                linear-gradient(
                    135deg,
                    #e4c1ff,
                    #bd84ec
                );

            border-color: transparent;

            font-weight: 700;
        }


        .button.secondary {
            color: var(--text-main);

            background:
                rgba(255, 255, 255, 0.045);
        }


        /* --------------------------------
           SCROLL INDICATOR
        -------------------------------- */

        .scroll-indicator {
            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            color: var(--text-muted);

            font-size: 0.7rem;

            letter-spacing: 0.14em;

            text-transform: uppercase;
        }


        .scroll-indicator::after {
            content: "";

            display: block;

            width: 1px;
            height: 34px;

            margin: 10px auto 0;

            background:
                linear-gradient(
                    var(--accent),
                    transparent
                );
        }


        /* --------------------------------
           GENERAL SECTION
        -------------------------------- */

        section {
            scroll-margin-top: 110px;
        }


        .section {
            max-width: var(--max-width);

            margin: auto;

            padding:
                100px 24px;
        }


        .section-heading {
            max-width: 680px;

            margin-bottom: 48px;
        }


        .section-label {
            display: block;

            margin-bottom: 10px;

            color: var(--accent);

            font-size: 0.72rem;

            letter-spacing: 0.15em;

            text-transform: uppercase;

            font-weight: 700;
        }


        .section-heading h2 {
            margin-bottom: 15px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(2.6rem, 6vw, 4.4rem);

            font-weight: 500;

            line-height: 0.95;
        }


        .section-heading p {
            color: var(--text-soft);

            line-height: 1.8;
        }


        /* --------------------------------
           GLASS CARD
        -------------------------------- */

        .card {
            position: relative;

            padding: clamp(25px, 5vw, 48px);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                );

            border:
                1px solid var(--border);

            border-radius: var(--radius-large);

            box-shadow: var(--shadow);

            backdrop-filter: blur(18px);

            overflow: hidden;
        }


        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );
        }


        .card p {
            color: #d0cdd5;

            font-size:
                clamp(1rem, 2vw, 1.08rem);

            line-height: 1.95;
        }


        .card p + p {
            margin-top: 22px;
        }


        /* --------------------------------
           FEELINGS
        -------------------------------- */

        .quote-card {
            text-align: center;
        }


        .quote-mark {
            display: block;

            margin-bottom: 18px;

            color: var(--accent);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 5rem;

            line-height: 0.5;
        }


        .quote-card p {
            max-width: 800px;

            margin-inline: auto;
        }


        /* --------------------------------
           TWO COLUMN
        -------------------------------- */

        .two-column {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }


        .mini-card {
            padding: 30px;

            border:
                1px solid var(--border);

            border-radius: var(--radius-medium);

            background:
                rgba(255, 255, 255, 0.035);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease;
        }


        .mini-card:hover {
            transform: translateY(-5px);

            background:
                rgba(255, 255, 255, 0.055);

            border-color:
                rgba(215, 166, 255, 0.25);
        }


        .mini-icon {
            width: 46px;
            height: 46px;

            display: grid;

            place-items: center;

            margin-bottom: 18px;

            border-radius: 15px;

            background:
                rgba(215, 166, 255, 0.10);

            font-size: 1.25rem;
        }


        .mini-card h3 {
            margin-bottom: 10px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 1.75rem;

            font-weight: 600;
        }


        .mini-card p {
            color: var(--text-soft);

            line-height: 1.75;

            font-size: 0.94rem;
        }


        /* --------------------------------
           HIDE AND SEEK
        -------------------------------- */

        .game-card {
            text-align: center;
        }


        .game-area {
            position: relative;

            min-height: 300px;

            margin-top: 30px;

            border:
                1px solid var(--border);

            border-radius: 22px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(215,166,255,0.08),
                    transparent 55%
                ),
                rgba(0,0,0,0.16);

            overflow: hidden;
        }


        .game-message {
            position: absolute;

            top: 28px;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            color: var(--text-muted);

            font-size: 0.85rem;
        }


        .seek-button {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 75px;
            height: 75px;

            display: grid;

            place-items: center;

            border: none;

            border-radius: 50%;

            color: #17111c;

            background:
                linear-gradient(
                    135deg,
                    #efd4ff,
                    #bd82ed
                );

            cursor: pointer;

            font-size: 1.7rem;

            box-shadow:
                0 15px 45px rgba(189, 130, 237, 0.22);

            transition:
                transform 0.2s ease;
        }


        .seek-button:hover {
            transform:
                translate(-50%, -50%)
                scale(1.08);
        }


        /* --------------------------------
           BOARDS SECTION
        -------------------------------- */

        .study-card {
            display: grid;

            grid-template-columns:
                0.8fr 1.2fr;

            gap: 40px;

            align-items: center;
        }


        .study-title {
            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(2.6rem, 5vw, 4rem);

            line-height: 0.95;
        }


        .study-title span {
            color: var(--accent);
        }


        .study-content p {
            color: var(--text-soft);

            line-height: 1.85;
        }


        .study-list {
            display: grid;

            gap: 10px;

            margin-top: 22px;

            list-style: none;
        }


        .study-list li {
            display: flex;

            gap: 10px;

            color: #d7d3dc;

            line-height: 1.5;
        }


        .study-list li::before {
            content: "✓";

            color: var(--accent);

            font-weight: 700;
        }


        /* --------------------------------
           REALITY SECTION
        -------------------------------- */

        .reality {
            border-color:
                rgba(215, 166, 255, 0.18);

            background:
                linear-gradient(
                    135deg,
                    rgba(215,166,255,0.08),
                    rgba(255,255,255,0.025)
                );
        }


        .reality strong {
            color: var(--text-main);
        }


        /* --------------------------------
           FINAL NOTE
        -------------------------------- */

        .final-section {
            padding-bottom: 150px;
        }


        .final-card {
            text-align: center;

            padding:
                clamp(35px, 7vw, 75px);
        }


        .final-card h2 {
            margin-bottom: 25px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(3rem, 7vw, 5.5rem);

            font-weight: 500;

            line-height: 0.9;
        }


        .final-card h2 span {
            color: var(--accent);
        }


        .final-card p {
            max-width: 760px;

            margin: 0 auto 20px;
        }


        .final-signature {
            margin-top: 35px;

            color: var(--accent);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 1.7rem;
        }


        /* --------------------------------
           REVEAL BUTTON
        -------------------------------- */

        .reveal-button {
            margin-top: 30px;

            padding: 12px 20px;

            border:
                1px solid var(--border);

            border-radius: 999px;

            color: var(--text-main);

            background:
                rgba(255,255,255,0.04);

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease;
        }


        .reveal-button:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.08);
        }


        .hidden-note {
            max-height: 0;

            overflow: hidden;

            opacity: 0;

            transition:
                max-height 0.7s ease,
                opacity 0.5s ease,
                margin 0.5s ease;
        }


        .hidden-note.show {
            max-height: 400px;

            margin-top: 25px;

            opacity: 1;
        }


        /* --------------------------------
           FOOTER
        -------------------------------- */

        footer {
            padding:
                35px 24px 50px;

            text-align: center;

            color: var(--text-muted);

            font-size: 0.75rem;

            border-top:
                1px solid rgba(255,255,255,0.06);
        }


        footer span {
            color: var(--accent);
        }


        /* --------------------------------
           SCROLL REVEAL
        -------------------------------- */

        .reveal {
            opacity: 0;

            transform:
                translateY(35px);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        .reveal.visible {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* --------------------------------
           RESPONSIVE
        -------------------------------- */

        @media (max-width: 800px) {

            .nav {
                top: 12px;
            }


            .nav-links {
                display: none;
            }


            .hero {
                min-height: 92vh;

                padding-top: 130px;
            }


            .two-column {
                grid-template-columns: 1fr;
            }


            .study-card {
                grid-template-columns: 1fr;

                gap: 25px;
            }


            .section {
                padding:
                    75px 20px;
            }


            .game-area {
                min-height: 260px;
            }
        }


        @media (max-width: 500px) {

            .nav {
                width:
                    calc(100% - 22px);
            }


            .nav-logo {
                font-size: 0.82rem;
            }


            .hero h1 {
                font-size: 4.7rem;
            }


            .hero-subtitle {
                font-size: 0.95rem;

                line-height: 1
